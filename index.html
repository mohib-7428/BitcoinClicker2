<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Clicker 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="dark-theme">

    <div class="app-wrapper">
        <aside class="panel stats-panel">
            <h2>Stats</h2>
            <div class="stat-box">
                <small>Total Clicks</small>
                <div id="stat-clicks">0</div>
            </div>
            <div class="stat-box">
                <small>Best Balance</small>
                <div id="stat-highest">0 BTC</div>
            </div>
            <div class="stat-box">
                <small>Play Time</small>
                <div id="stat-time">00:00:00</div>
            </div>
            <button class="settings-btn" onclick="toggleSettings()">⚙ Settings</button>
        </aside>

        <main class="mining-area">
            <div class="header">
                <h1 id="balance">0.00000000</h1>
                <p>BITCOINS</p>
                <div class="income-rate">Earnings: +<span id="rate">0</span> BTC/s</div>
            </div>

            <div class="clicker-container">
                <img src="images/bitcoin.png" id="bitcoin-clicker" alt="Click!">
            </div>
            
            <div class="auto-save-tag" id="save-status">Game Saved</div>
        </main>

        <section class="panel shop-panel">
            <h2>Market</h2>
            <div id="shop-items" class="items-list">
                </div>
        </section>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3>Settings</h3>
            <div class="setting-row">
                <span>Theme</span>
                <button onclick="toggleTheme()">Change Look</button>
            </div>
            <div class="setting-row">
                <span>Manual Save</span>
                <button onclick="manualSave()">Save Now</button>
            </div>
            <div class="setting-row">
                <span>Danger Zone</span>
                <button class="reset-btn" onclick="hardReset()">Delete Progress</button>
            </div>
            <button class="close-btn" onclick="toggleSettings()">Close</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
